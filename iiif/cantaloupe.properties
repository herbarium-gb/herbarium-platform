###########################################################################
# Cantaloupe configuration for herbarium-platform (Grok processor)
#
# Mirrors the RAIS setup this replaces:
# - listens on :12415, same as RAIS_ADDRESS, so Caddyfile.server needs no
#   changes
# - reads images from /var/local/images, same mount as RAIS_TILEPATH
###########################################################################

http.enabled = true
http.host = 0.0.0.0
http.port = 12415

https.enabled = false

base_uri =

# Identifiers in this collection are file paths containing slashes
# (e.g. "2023/01/24/CP1_20230124_BATCH_0001/GB-0501228.jp2"). IIIF requires
# slashes within an identifier to be percent-encoded ("%2F"), which is easy
# to lose through a reverse proxy. Using a substitute character instead
# avoids that: the client sends "$" where a "/" belongs, unencoded.
slash_substitute = $

max_pixels = 0
max_scale = 1.0

log_error_responses = false
print_stack_trace_on_error_pages = false

delegate_script.enabled = false

endpoint.iiif.1.enabled = false
endpoint.iiif.2.enabled = true
endpoint.iiif.3.enabled = true
endpoint.iiif.min_size = 64
endpoint.iiif.min_tile_size = 512
endpoint.iiif.restrict_to_sizes = false

endpoint.admin.enabled = false
endpoint.api.enabled = false

endpoint.health.enabled = true
endpoint.health.dependency_check = false

###########################################################################
# SOURCES
###########################################################################

source.static = FilesystemSource
source.delegate = false

FilesystemSource.lookup_strategy = BasicLookupStrategy
FilesystemSource.BasicLookupStrategy.path_prefix = /var/local/images/
FilesystemSource.BasicLookupStrategy.path_suffix =

###########################################################################
# PROCESSORS
###########################################################################

processor.selection_strategy = ManualSelectionStrategy

processor.ManualSelectionStrategy.jp2 = GrokProcessor
processor.ManualSelectionStrategy.fallback = Java2dProcessor

processor.stream_retrieval_strategy = StreamStrategy
processor.fallback_retrieval_strategy = DownloadStrategy

processor.downscale_filter = bicubic
processor.upscale_filter = bicubic

processor.jpg.progressive = true
processor.jpg.quality = 80

GrokProcessor.path_to_binaries = /opt/grok/bin

###########################################################################
# CACHING
###########################################################################

# Matches RAIS today: no derivative cache. (600k images, mostly requested
# once, so a derivative cache wouldn't help much - see the caching
# discussion in the project history.)
cache.client.enabled = true
cache.client.max_age = 2592000
cache.client.public = true

cache.server.derivative.enabled = false
cache.server.info.enabled = false

###########################################################################
# LOGGING
###########################################################################

log.application.level = info
log.application.ConsoleAppender.enabled = true

log.access.ConsoleAppender.enabled = false
